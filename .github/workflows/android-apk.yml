name: Build MT Photos APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source unpacker
        run: python -m pip install brotli
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore preserved MT Photos source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, brotli, io, tarfile
          from pathlib import Path
          payload = base64.b64decode(Path('.bundle/source.tar.br.b64').read_text().strip())
          with tarfile.open(fileobj=io.BytesIO(brotli.decompress(payload))) as archive:
              root = Path('.').resolve()
              for item in archive.getmembers():
                  target = (root / item.name).resolve()
                  if not target.is_relative_to(root) or item.issym() or item.islnk():
                      raise ValueError('Unsafe archive path')
              archive.extractall(root, filter='data')
          PY
      - name: Show Merge People on the main People screen
        run: python3 scripts/add-merge-ui.py
      - name: Download licensed offline face models
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request, pathlib
          source='https://raw.githubusercontent.com/opencv/opencv_zoo/main/models/'
          models=[
            ('yunet.onnx','face_detection_yunet/face_detection_yunet_2023mar.onnx','0b6ceccb83e3d6cb38ae9a92499469937eb210e0267f26f7e68c5a13b53818c3'),
            ('sface.onnx','face_recognition_sface/face_recognition_sface_2021dec_int8.onnx','6430b2c142fbfa1b741f9e13f01b53c92b88fbc438221968cde6e3e9906a5798')]
          destination=pathlib.Path('app/src/main/assets')
          destination.mkdir(parents=True,exist_ok=True)
          for name,path,expected in models:
              data=urllib.request.urlopen(source+path,timeout=90).read()
              actual=hashlib.sha256(data).hexdigest()
              if actual != expected: raise RuntimeError(f'Model checksum mismatch for {name}: {actual}')
              (destination/name).write_bytes(data)
          PY
      - name: Run existing data-safety and merge tests
        run: |
          python3 tests/check_merge.py
          mkdir -p /tmp/mt-tests
          javac -d /tmp/mt-tests app/src/main/java/com/emily/mtphotos/FaceMatching.java tests/FaceMatchingTest.java
          java -cp /tmp/mt-tests com.emily.mtphotos.FaceMatchingTest
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload downloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MT-Photos-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
